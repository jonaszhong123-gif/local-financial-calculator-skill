vollständig wiederveranlagt. Dadurch entsteht wirtschaftlich eine neue Anschaffung in Höhe der Netto-Ausschüttung.",l1="ETF-Steuerdaten werden in der Realität fonds- und jahresspezifisch über OeKB-Steuerdaten sowie Meldefonds-/Nichtmeldefonds-Regeln berechnet. Ausschüttungen und AgE sind hier vereinfachte Modellannahmen.",i1="Versicherungssteuer",u1="Versicherungssteuer-Anteil an der Bruttoprämie",s1="3,85 % ist der aus dem Antrag abgeleitete Anteil an der Bruttoprämie und entspricht rechnerisch ca. 4 % Versicherungssteuer auf die Nettoprämie. Es ist kein gesetzlicher Steuersatz von 3,85 %.",r1="Rückkaufsabschlag",c1="Schlussgewinnanteile-Abschlag",o1="vor",d1="Deckungsstock-Modellzins",f1="Deckungsstock-Modellzins / Modellannahme, keine Garantie.",m1="Deckungsstock-Anteil",h1="0–100 % einstellbar. Geprüft ist die Vertragsaufteilung 5 % Deckungsstock / 95 % Fonds; andere Anteile werden mit derselben Kostenstruktur extrapoliert (ungeprüfte Konfigurationssimulation, kein versicherbares Tarifversprechen).",g1="Im Hybrid-Monatsmodell dürfen 6,97 % laufende prämienbezogene Kosten und 6,50 % Abschlusskosten nicht ungeprüft doppelt gezählt werden. Die aktuelle Parameterlogik folgt dem gewählten Kostenmodus; vor formaler Verwendung ist dies mit Antrag/Kosteninformation zu prüfen. Der Hybrid-Antrag nennt zusätzlich einen 10-%-Abschlag auf zugeordnete Schlussgewinnanteile bei vorzeitiger Kapitalauszahlung bzw. Rückkauf. Ohne Versichererwert wird dieser Abschlag nur als Risiko angezeigt und nicht automatisch abgezogen.",p1="Wenn Einmalprämie und monatliche Prämie gleichzeitig eingegeben werden, handelt es sich um eine modellhafte Kombinationsrechnung. Die tatsächliche Kosten- und Steuerbehandlung richtet sich nach Antrag, Offert und Polizze.",y1="Timingannahme für laufende Zahlungen",b1="Monatsanfang",v1="Monatsende",S1="Risikoprämie Ableben",x1="prämienbezogene Kosten",R1="Verwaltungskosten",T1="indikative Rückkauf-Simulation: 1 %-Abschlag",A1="7 % Versicherungssteuer-Nachver skosten und steuerliche Behandlung.",nS="Das ETF-Depot wird vor allem durch KESt, Depotentgelt und Fondskosten beeinflusst; die 100 % Fonds-LV durch Sparprämie, Versicherungssteuer, Risiko- und Verwaltungskosten; die Hybrid-LV zusätzlich durch die Aufteilung zwischen Deckungsstock und Fonds.",aS="Erläuterung öffnen",lS="Die Differenz entsteht vor allem dadurch, dass beim ETF das investierte Kapital direkt im Depot veranlagt wird, Gewinne im Modell jedoch mit KESt belastet werden. Bei der Lebensversicherung wird nicht die gesamte Prämie veranlagt, sondern nur die Sparprämie; zusätzlich werden Versicherungssteuer, Risikoprämie, prämienbezogene Kosten und Verwaltungskosten berücksichtigt. Die steuerliche Behandlung folgt dem gewählten Modell.",iS="Hinweis: Bei der Lebensversicherung wird nicht die gesamte Prämie veranlagt; nur die Sparprämie fließt in Fonds bzw. Deckungsstock.",uS="Quellen und Annahmen",sS="Haftungsausschluss",rS="Gebühren- und Steuerparameter werden manuell gepflegt; Einträge mit needsVerification müssen fachlich geprüft werden. Die ETF-Steuerlogik ist keine exakte Steuerberatung und hängt vom konkreten ISIN, Fondsjahr, OeKB-Steuerdaten sowie Meldefonds-/Nichtmeldefonds-Regeln ab.",cS="Produktgrenzen: Die Lebensversicherungs-Varianten sind nicht kapitalgarantiert; 6 %, 11,19 % und Modellpensionen sind keine Garantien. Der Deckungsstock-Modellzins der Hybrid-LV ist keine Garantie. Kundinnen und Kunden halten die ETF-Anteile nicht direkt. ETF-Anteile im Direktdepot sind nicht kostengewinnberechtigt. Die steuerliche Behandlung der Kapitalablöse hängt von Steueransässigkeit, Vertragsstruktur, Prämienstruktur, Rückkauf, Prämienfreistellung, Auszahlungsform und künftigem Steuerrecht ab.",oS="Gewöhnliches Depotmodell; KESt wird nur auf realisierte Gewinne geschätzt. Verkaufsspesen mindern die Auszahlung, aber nicht die KESt-Bemessungsgrundlage. Ausschüttungen werden nach KESt wiederveranlagt; AgE/OeKB werden vereinfacht modelliert.",dS="Lebensversicherungsmodell; die Bruttoprämie wird nicht vollständig veranlagt, nur die Sparprämie fließt in Fonds bzw. Deckungsstock. 3,85 % wird als Versicherungssteuer-Anteil an der Bruttoprämie gezeigt; returnMode = netOfFundCosts; qualifizierte Kapitalablöse mit KESt = 0 ist nur eine Modellannahme. Vorzeitiger Rückkauf wird getrennt von der Endwert-Modellrechnung behandelt: Ohne offizielle Rückkaufswert-Tabelle wird nur eine indikative Rückkauf-Simulation gezeigt; der 1 % Abschlag nutzt Deckungsrückstellung bzw. Modellwert als Näherung; 7 % Nachversteuerung wird nur bei erfüllten Bedingungen geschätzt; der 10 % Abschlag auf Hybrid-Schlussgewinnanteile wird nur bei Eingabe eines Versichererwerts abgezogen. Tatsächlicher Rückkaufswert, Nachversteuerung, einkommensteuerliche Folgen und Schlussgewinnanteile sind mit Polizze, Versicherer und Steuerberatung zu bestätigen.",fS="ETF-Jahreswerte sind vereinfachte hypothetische Nach-Steuer-Liquidationswerte und keine exakte Steuerabrechnung.",mS="Zwischenwerte der Lebensversicherung sind keine Rückkaufswerte. Ein Rückkauf muss vertragsspezifisch berechnet werden.",hS="Zwischenwerte der Hybrid-LV sind keine Rückkaufswerte. Der Deckungsstock-Modellzins ist eine Modellannahme und keine Garantie.",gS="Dieses PDF ist nur eine unverbindliche Modellrechnung und stellt keine Anlage-, Steuer- oder Produktempfehlung dar. Kurven, Jahreswerte und Modellpensionen stellen keine Garantien, Rückkaufswerte oder exakte Steuerabrechnungen dar.",pS="Vorzeitiger Rückkauf: Das Ergebnis ist nur eine indikative Rückkauf-Simulation und kein garantierter Rückkaufswert. Der 1 % Abschlag nutzt Deckungsrückstellung bzw. Modellwert als Näherung; die Grenze gilt bei der 100 % Fonds-LV bis 01.08.2041 und bei Hybrid bis 01.08.2051/01.08.2056. Die 7 % Versicherungssteuer-Nachversteuerung wird nur bei erfüllten Bedingungen geschätzt, etwa Einmalerlag innerhalb der Haltefrist oder schädliche Prämienfreistellung/-reduktion bei laufender Prämie. Normale laufende Prämien lösen nicht allein wegen Rückkauf vor 15 Jahren automatisch 7 % aus. Der 10 % Abschlag auf Hybrid-Schlussgewinnanteile wird nur bei Eingabe eines Versichererwerts abgezogen. Vorzeitiger Rückkauf kann einkommensteuerliche Folgen haben; dieses Tool berechnet keine Einkommensteuer.",yS="steuerpflichtiger Gewinn",bS="Diese Berechnung ist eine unverbindliche Modellrechnung. Sie stellt keine Anlageberatung, keine steuerliche Beratung und keine konkrete Produktempfehlung dar. Maßgeblich sind das konkrete Angebot, der Antrag, der Versicherungsvertrag, die Basisinformationsblätter sowie die jeweils geltenden steuerlichen Vorschriften.",vS={appTitle:wp,appSubtitle:Gp,shortComplianceNotice:qp,language:$p,chinese:Xp,german:Qp,displayMode:Zp,clientMode:Jp,professionalMode:Wp,auditMode:Ip,inputs:ey,productSelection:ty,modelSelection:ny,sameContributions:ay,sameAssumptions:ly,sharedInputs:iy,sharedInputsHelper:uy,sharedProductInputsHidden:sy,depotModel:ry,depotModelHelp:cy,customDepotModel:oy,depotComparisonTitle:dy,depotComparisonFairnessNote:fy,depotComparisonEmptyState:my,depotComparisonBestModelValue:hy,depotComparisonDataNote:gy,rank:py,differenceToSelectedDepot:yy,brokerCosts:by,buySellFees:vy,sourceStatus:Sy,selectedDepot:xy,verifiedSource:Ry,mainInfluencingFactors:Ty,productStructure:Ay,selectAtLeastOneModel:Ey,lumpSum:My,monthlyContribution:Dy,singlePremium:Ny,monthlyPremium:Cy,years:jy,annualReturn:zy,annualFundReturn:Oy,calculationMode:ky,modeEtfDepot:By,modeInsurance:Fy,modeComparison:Uy,taxModelHelper:_y,etfProductNote:Ly,fondsLvProductNote:Yy,hybridProductNote:Vy,etfSelectableDescription:Hy,fondsLvSelectableDescription:Py,hybridSelectableDescription:Ky,insuranceContract:wy,insuranceContractHelper:Gy,advancedSettings:qy,earlyExit:$y,exitYear:Xy,modelBasis:Qy,modelBasisPackageReference:Zy,modelBasisContractParameters:Jy,modelBasisHelper:Wy,contractStartDate:Iy,ageAtStartOver50:eb,premiumFreeWithinFirst3Years:tb,premiumReductionWithinFirst3Years:nb,allocatedSchlussgewinnanteile:a
