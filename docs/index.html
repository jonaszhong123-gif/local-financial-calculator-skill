Garantie.",bv="Deckungsstock-Anteil",vv="0–100 % einstellbar. Geprüft ist die Vertragsaufteilung 5 % Deckungsstock / 95 % Fonds; andere Anteile werden mit derselben Kostenstruktur extrapoliert (ungeprüfte Konfigurationssimulation, kein versicherbares Tarifversprechen).",Sv="Im Hybrid-Monatsmodell dürfen 6,97 % laufende prämienbezogene Kosten und 6,50 % Abschlusskosten nicht ungeprüft doppelt gezählt werden. Die aktuelle Parameterlogik folgt dem gewählten Kostenmodus; vor formaler Verwendung ist dies mit Antrag/Kosteninformation zu prüfen. Der Hybrid-Antrag nennt zusätzlich einen 10-%-Abschlag auf zugeordnete Schlussgewinnanteile bei vorzeitiger Kapitalauszahlung bzw. Rückkauf. Ohne Versichererwert wird dieser Abschlag nur als Risiko angezeigt und nicht automatisch abgezogen.",xv="Wenn Einmalprämie und monatliche Prämie gleichzeitig eingegeben werden, handelt es sich um eine modellhafte Kombinationsrechnung. Die tatsächliche Kosten- und Steuerbehandlung richtet sich nach Antrag, Offert und Polizze.",Rv="Timingannahme für laufende Zahlungen",Av="Monatsanfang",Tv="Monatsende",Ev="Risikoprämie Ableben",Mv="prämienbezogene Kosten",Cv="Verwaltungskosten",Dv="indikative Rückkauf-Simulation: 1 %-Abschlag",Nv="7 % Versicherungssteuer-Nachversteuerung",jv="auf Basis der Nettoprämie",zv="Sparprämie bei laufender Prämie",kv="Versicherungssteuer-Anteil bei laufender Prämie",Ov="Risikoprämie Ableben bei laufender Prämie",Bv="Kosten bei laufender Prämie",Fv="Verwaltungskosten bei reiner laufender Prämie",Pv="KESt",Lv="KESt auf Ausschüttungen",Uv="KESt auf AgE",_v="KESt auf realisierten Kursgewinn",Yv="angepasste Anschaffungskosten",Vv="Auszahlung nach Steuer",Hv="Erwartete Differenz",Kv="modellhafter Nettozuwachs",wv="Kosten-/Steuerübersicht",Gv="Detailkosten und Steuern",qv="Differenz der Modellendwerte",$v="Konfigurationssimulation",Qv="Dies ist eine Modellrechnung mit unterschiedlichen Konfigurationen. Daraus sollte kein direkter Produktvorteil abgeleitet werden. Für einen fairen Vergleich verwenden Sie bitte identische Einzahlungen/Prämien, Laufzeiten und Renditeannahmen.",Xv="Dies ist eine Modellrechnung mit unterschiedlichen Konfigurationen. Daraus sollte kein direkter Produktvorteil abgeleitet werden. Für einen fairen Vergleich verwenden Sie bitte identische Einzahlungen/Prämien, Laufzeiten und Renditeannahmen.",Zv="Dies ist eine Modellrechnung mit unterschiedlichen Konfigurationen. Daraus sollte kein direkter Produktvorteil abgeleitet werden. Für einen fairen Vergleich verwenden Sie bitte identische Einzahlungen/Prämien, Laufzeiten und Renditeannahmen.",Jv="Höherer Modellwert",Wv="Höherer Modellwert bei identischen Eingaben",Iv="Höherer Modellwert bei identischen Eingaben",eS="Dies ist eine Konfigurationssimulation. Da mindestens ein Modell andere Einzahlungen/Prämien, Laufzeiten, Fondsrenditen oder Steuermodelle verwendet, sollte daraus kein direkter Produktvorteil abgeleitet werden.",tS="Warum die Ergebnisse abweichen",nS="voraussichtlich höher um",aS="ETF-Depot mit höherem Modellwert",lS="Lebensversicherung mit höherem Modellwert",iS="Beide Varianten sind gleich hoch",uS="Das ETF-Depot wird vor allem durch KESt beeinflusst; die Lebensversicherung durch Versicherungssteuer, Risikokosten, Verwaltungskosten und steuerliche Behandlung.",rS="Das ETF-Depot wird vor allem durch KESt, Depotentgelt und Fondskosten beeinflusst; die 100 % Fonds-LV durch Sparprämie, Versicherungssteuer, Risiko- und Verwaltungskosten; die Hybrid-LV zusätzlich durch die Aufteilung zwischen Deckungsstock und Fonds.",sS="Erläuterung öffnen",cS="Die Differenz entsteht vor allem dadurch, dass beim ETF das investierte Kapital direkt im Depot veranlagt wird, Gewinne im Modell jedoch mit KESt belastet werden. Bei der Lebensversicherung wird nicht die gesamte Prämie veranlagt, sondern nur die Sparprämie; zusätzlich werden Versicherungssteuer, Risikoprämie, prämienbezogene Kosten und Verwaltungskosten berücksichtigt. Die steuerliche Behandlung folgt dem gewählten Modell.",oS="Hinweis: Bei der Lebensversicherung wird nicht die gesamte Prämie veranlagt; nur die Sparprämie fließt in Fonds bzw. Deckungsstock.",dS="Quellen und Annahmen",fS="Haftungsausschluss",mS="Gebühren- und Steuerparameter werden manuell gepflegt; Einträge mit needsVerification müssen fachlich geprüft werden. Die ETF-Steuerlogik ist keine exakte Steuerberatung und hängt vom konkreten ISIN, Fondsjahr, OeKB-Steuerdaten sowie Meldefonds-/Nichtmeldefonds-Regeln ab.",hS="Produktgrenzen: Die Lebensversicherungs-Varianten sind nicht kapitalgarantiert; 6 %, 11,19 % und Modellpensionen sind keine Garantien. Der Deckungsstock-Modellzins der Hybrid-LV ist keine Garantie. Kundinnen und Kunden halten die ETF-Anteile nicht direkt. ETF-Anteile im Direktdepot sind nicht kostengewinnberechtigt. Die steuerliche Behandlung der Kapitalablöse hängt von Steueransässigkeit, Vertragsstruktur, Prämienstruktur, Rückkauf, Prämienfreistellung, Auszahlungsform und künftigem Steuerrecht ab.",gS="Gewöhnliches Depotmodell; KESt wird nur auf realisierte Gewinne geschätzt. Verkaufsspesen mindern die Auszahlung, aber nicht die KESt-Bemessungsgrundlage. Ausschüttungen werden nach KESt wiederveranlagt; AgE/OeKB werden vereinfacht modelliert.",pS="Lebensversicherungsmodell; die Bruttoprämie wird nicht vollständig veranlagt, nur die Sparprämie fließt in Fonds bzw. Deckungsstock. 3,85 % wird als Versicherungssteuer-Anteil an der Bruttoprämie gezeigt; returnMode = netOfFundCosts; qualifizierte Kapitalablöse mit KESt = 0 ist nur eine Modellannahme. Vorzeitiger Rückkauf wird getrennt von der Endwert-Modellrechnung behandelt: Ohne offizielle Rückkaufswert-Tabelle wird nur eine indikative Rückkauf-Simulation gezeigt; der 1 % Abschlag nutzt Deckungsrückstellung bzw. Modellwert als Näherung; 7 % Nachversteuerung wird nur bei erfüllten Bedingungen geschätzt; der 10 % Abschlag auf Hybrid-Schlussgewinnanteile wird nur bei Eingabe eines Versichererwerts abgezogen. Tatsächlicher Rückkaufswert, Nachversteuerung, einkommensteuerliche Folgen und Schlussgewinnanteile sind mit Polizze, Versicherer und Steuerberatung zu bestätigen.",yS="ETF-Jahreswerte sind vereinfachte hypothetische Nach-Steuer-Liquidationswerte und keine exakte Steuerabrechnung.",bS="Zwischenwerte der Lebensversicherung sind keine Rückkaufswerte. Ein Rückkauf muss vertragsspezifisch berechnet werden.",vS="Zwischenwerte der Hybrid-LV sind keine Rückkaufswerte. Der Deckungsstock-Modellzins ist eine Modellannahme und keine Garantie.",SS="Dieses PDF ist nur eine unverbindliche Modellrechnung und stellt keine Anlage-, Steuer- oder Produktempfehlung dar. Kurven, Jahreswerte und Modellpensionen stellen keine Garantien, Rückkaufswerte oder exakte Steuerabrechnungen dar.",xS="Vorzeitiger Rückkauf: Das Ergebnis ist nur eine indikative Rückkauf-Simulation und kein garantierter Rückkaufswert. Der 1 % Abschlag nutzt Deckungsrückstellung bzw. Modellwert als Näherung; die Grenze gilt bei der 100 % Fonds-LV bis 01.08.2041 und bei Hybrid bis 01.08.2051/01.08.2056. Die 7 % Versicherungssteuer-Nachversteuerung wird nur bei erfüllten Bedingungen geschätzt, etwa Einmalerlag innerhalb der Haltefrist oder schädliche Prämienfreistellung/-reduktion bei laufender Prämie. Normale laufende Prämien lösen nicht allein wegen Rückkauf vor 15 Jahren automatisch 7 % aus. Der 10 % Abschlag auf Hybrid-Schlussgewinnanteile wird nur bei Eingabe eines Versichererwerts abgezogen. Vorzeitiger Rückkauf kann einkommensteuerliche Folgen haben; dieses Tool berechnet keine Einkommensteuer.",RS="steuerpflichtiger Gewinn",AS="Diese Berechnung ist eine unverbindliche Modellrechnung. Sie stellt keine Anlageberatung, keine steuerliche Beratung und keine konkrete Produktempfehlung dar. Maßgeblich sind das konkrete Angebot, der Antrag, der Versicherungsvertrag, die Basisinformationsblätter sowie die jeweils geltenden steuerlichen Vorschriften.",TS="Hybrid-Vertrag",ES="Waehlt die Kostenstruktur des hybriden Modells. Die zulaessige Deckungsstock-Quote haengt vom gewae
