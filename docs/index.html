ile-Abschlag",b1="vor",v1="Deckungsstock-Modellzins",S1="Deckungsstock-Modellzins / Modellannahme, keine Garantie.",x1="Deckungsstock-Anteil",R1="0–100 % einstellbar. Geprüft ist die Vertragsaufteilung 5 % Deckungsstock / 95 % Fonds; andere Anteile werden mit derselben Kostenstruktur extrapoliert (ungeprüfte Konfigurationssimulation, kein versicherbares Tarifversprechen).",A1="Im Hybrid-Monatsmodell dürfen 6,97 % laufende prämienbezogene Kosten und 6,50 % Abschlusskosten nicht ungeprüft doppelt gezählt werden. Die aktuelle Parameterlogik folgt dem gewählten Kostenmodus; vor formaler Verwendung ist dies mit Antrag/Kosteninformation zu prüfen. Der Hybrid-Antrag nennt zusätzlich einen 10-%-Abschlag auf zugeordnete Schlussgewinnanteile bei vorzeitiger Kapitalauszahlung bzw. Rückkauf. Ohne Versichererwert wird dieser Abschlag nur als Risiko angezeigt und nicht automatisch abgezogen.",T1="Wenn Einmalprämie und monatliche Prämie gleichzeitig eingegeben werden, handelt es sich um eine modellhafte Kombinationsrechnung. Die tatsächliche Kosten- und Steuerbehandlung richtet sich nach Antrag, Offert und Polizze.",E1="Timingannahme für laufende Zahlungen",C1="Monatsanfang",M1="Monatsende",D1="Risikoprämie Ableben",N1="prämienbezogene Kosten",j1="Verwaltungskosten",z1="indikative Rückkauf-Simulation: 1 %-Abschlag",k1="7 % Versicherungssteuer-Nachversteuerung",O1="auf Basis der Nettoprämie",B1="Sparprämie bei laufender Prämie",P1="Versicherungssteuer-Anteil bei laufender Prämie",F1="Risikoprämie Ableben bei laufender Prämie",L1="Kosten bei laufender Prämie",U1="Verwaltungskosten bei reiner laufender Prämie",_1="KESt",V1="KESt auf Ausschüttungen",Y1="KESt auf AgE",K1="KESt auf realisierten Kursgewinn",H1="angepasste Anschaffungskosten",w1="Auszahlung nach Steuer",G1="Erwartete Differenz",q1="modellhafter Nettozuwachs",$1="Kosten-/Steuerübersicht",Q1="Detailkosten und Steuern",X1="Differenz der Modellendwerte",Z1="Konfigurationssimulation",J1="Dies ist eine Modellrechnung mit unterschiedlichen Konfigurationen. Daraus sollte kein direkter Produktvorteil abgeleitet werden. Für einen fairen Vergleich verwenden Sie bitte identische Einzahlungen/Prämien, Laufzeiten und Renditeannahmen.",W1="Dies ist eine Modellrechnung mit unterschiedlichen Konfigurationen. Daraus sollte kein direkter Produktvorteil abgeleitet werden. Für einen fairen Vergleich verwenden Sie bitte identische Einzahlungen/Prämien, Laufzeiten und Renditeannahmen.",I1="Dies ist eine Modellrechnung mit unterschiedlichen Konfigurationen. Daraus sollte kein direkter Produktvorteil abgeleitet werden. Für einen fairen Vergleich verwenden Sie bitte identische Einzahlungen/Prämien, Laufzeiten und Renditeannahmen.",eS="Höherer Modellwert",tS="Höherer Modellwert bei identischen Eingaben",nS="Höherer Modellwert bei identischen Eingaben",aS="Dies ist eine Konfigurationssimulation. Da mindestens ein Modell andere Einzahlungen/Prämien, Laufzeiten, Fondsrenditen oder Steuermodelle verwendet, sollte daraus kein direkter Produktvorteil abgeleitet werden.",lS="Warum die Ergebnisse abweichen",iS="voraussichtlich höher um",uS="ETF-Depot mit höherem Modellwert",rS="Lebensversicherung mit höherem Modellwert",sS="Beide Varianten sind gleich hoch",cS="Das ETF-Depot wird vor allem durch KESt beeinflusst; die Lebensversicherung durch Versicherungssteuer, Risikokosten, Verwaltungskosten und steuerliche Behandlung.",oS="Das ETF-Depot wird vor allem durch KESt, Depotentgelt und Fondskosten beeinflusst; die 100 % Fonds-LV durch Sparprämie, Versicherungssteuer, Risiko- und Verwaltungskosten; die Hybrid-LV zusätzlich durch die Aufteilung zwischen Deckungsstock und Fonds.",dS="Erläuterung öffnen",fS="Die Differenz entsteht vor allem dadurch, dass beim ETF das investierte Kapital direkt im Depot veranlagt wird, Gewinne im Modell jedoch mit KESt belastet werden. Bei der Lebensversicherung wird nicht die gesamte Prämie veranlagt, sondern nur die Sparprämie; zusätzlich werden Versicherungssteuer, Risikoprämie, prämienbezogene Kosten und Verwaltungskosten berücksichtigt. Die steuerliche Behandlung folgt dem gewählten Modell.",mS="Hinweis: Bei der Lebensversicherung wird nicht die gesamte Prämie veranlagt; nur die Sparprämie fließt in Fonds bzw. Deckungsstock.",hS="Quellen und Annahmen",gS="Haftungsausschluss",pS="Gebühren- und Steuerparameter werden manuell gepflegt; Einträge mit needsVerification müssen fachlich geprüft werden. Die ETF-Steuerlogik ist keine exakte Steuerberatung und hängt vom konkreten ISIN, Fondsjahr, OeKB-Steuerdaten sowie Meldefonds-/Nichtmeldefonds-Regeln ab.",yS="Produktgrenzen: Die Lebensversicherungs-Varianten sind nicht kapitalgarantiert; 6 %, 11,19 % und Modellpensionen sind keine Garantien. Der Deckungsstock-Modellzins der Hybrid-LV ist keine Garantie. Kundinnen und Kunden halten die ETF-Anteile nicht direkt. ETF-Anteile im Direktdepot sind nicht kostengewinnberechtigt. Die steuerliche Behandlung der Kapitalablöse hängt von Steueransässigkeit, Vertragsstruktur, Prämienstruktur, Rückkauf, Prämienfreistellung, Auszahlungsform und künftigem Steuerrecht ab.",bS="Gewöhnliches Depotmodell; KESt wird nur auf realisierte Gewinne geschätzt. Verkaufsspesen mindern die Auszahlung, aber nicht die KESt-Bemessungsgrundlage. Ausschüttungen werden nach KESt wiederveranlagt; AgE/OeKB werden vereinfacht modelliert.",vS="Lebensversicherungsmodell; die Bruttoprämie wird nicht vollständig veranlagt, nur die Sparprämie fließt in Fonds bzw. Deckungsstock. 3,85 % wird als Versicherungssteuer-Anteil an der Bruttoprämie gezeigt; returnMode = netOfFundCosts; qualifizierte Kapitalablöse mit KESt = 0 ist nur eine Modellannahme. Vorzeitiger Rückkauf wird getrennt von der Endwert-Modellrechnung behandelt: Ohne offizielle Rückkaufswert-Tabelle wird nur eine indikative Rückkauf-Simulation gezeigt; der 1 % Abschlag nutzt Deckungsrückstellung bzw. Modellwert als Näherung; 7 % Nachversteuerung wird nur bei erfüllten Bedingungen geschätzt; der 10 % Abschlag auf Hybrid-Schlussgewinnanteile wird nur bei Eingabe eines Versichererwerts abgezogen. Tatsächlicher Rückkaufswert, Nachversteuerung, einkommensteuerliche Folgen und Schlussgewinnanteile sind mit Polizze, Versicherer und Steuerberatung zu bestätigen.",SS="ETF-Jahreswerte sind vereinfachte hypothetische Nach-Steuer-Liquidationswerte und keine exakte Steuerabrechnung.",xS="Zwischenwerte der Lebensversicherung sind keine Rückkaufswerte. Ein Rückkauf muss vertragsspezifisch berechnet werden.",RS="Zwischenwerte der Hybrid-LV sind keine Rückkaufswerte. Der Deckungsstock-Modellzins ist eine Modellannahme und keine Garantie.",AS="Dieses PDF ist nur eine unverbindliche Modellrechnung und stellt keine Anlage-, Steuer- oder Produktempfehlung dar. Kurven, Jahreswerte und Modellpensionen stellen keine Garantien, Rückkaufswerte oder exakte Steuerabrechnungen dar.",TS="Vorzeitiger Rückkauf: Das Ergebnis ist nur eine indikative Rückkauf-Simulation und kein garantierter Rückkaufswert. Der 1 % Abschlag nutzt Deckungsrückstellung bzw. Modellwert als Näherung; die Grenze gilt bei der 100 % Fonds-LV bis 01.08.2041 und bei Hybrid bis 01.08.2051/01.08.2056. Die 7 % Versicherungssteuer-Nachversteuerung wird nur bei erfüllten Bedingungen geschätzt, etwa Einmalerlag innerhalb der Haltefrist oder schädliche Prämienfreistellung/-reduktion bei laufender Prämie. Normale laufende Prämien lösen nicht allein wegen Rückkauf vor 15 Jahren automatisch 7 % aus. Der 10 % Abschlag auf Hybrid-Schlussgewinnanteile wird nur bei Eingabe eines Versichererwerts abgezogen. Vorzeitiger Rückkauf kann einkommensteuerliche Folgen haben; dieses Tool berechnet keine Einkommensteuer.",ES="steuerpflichtiger Gewinn",CS="Diese Berechnung ist eine unverbindliche Modellrechnung. Sie stellt keine Anlageberatung, keine steuerliche Beratung und keine konkrete Produktempfehlung dar. Maßgeblich sind das konkrete Angebot, der Antrag, der Versicherungsvertrag, die Basisinformationsblätter sowie die jeweils geltenden steuerlichen Vorschriften.",MS="Hybrid-Vertrag
